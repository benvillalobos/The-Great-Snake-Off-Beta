id: lessonpart7
title: 👑 Serpent Supreme
content: >
  *The stadium shakes as the crowd roars. Giant banners flutter overhead, each
  one painted with a different snake champion. At the center of the arena, the
  floor glows with swirling lights. Suddenly, the ground trembles—a massive,
  coiled red snake slithers into view, muscles rippling, champion belt
  gleaming.*


  **Serpent Supreme**: “Behold! The glory of randomness! No serpent can match my
  unpredictable power!”


  *SnakeBot coils beside you, eyes wide, earpiece buzzing with excitement.*


  **SnakeBot**: “Whoa, that's bananas! I mean, apples. How do we beat a snake we
  can't predict?”


  *Serpent Supreme charges for food, then, without warning, lunges at SnakeBot.
  The champion constantly changes tactics, keeping everyone guessing.*


  **Serpent Supreme**: “Chaos is my crown! Strategy is for the weak!”


  *SnakeBot slithers nervously, trying to keep up.*


  **SnakeBot**: “Okay, okay, I’ve got this. Wait—nope, he’s zigzagging again!
  How am I supposed to plan for THAT?”


  *The crowd gasps as Serpent Supreme suddenly ignores food and chases SnakeBot
  instead. Then, it rushes back towards apples with reckless speed.*


  **SnakeBot**: “I need a prompt that can handle anything! If he rushes food, I
  dodge. If he chases me, I run. If he…wait, what if he does both?”


  *This is the ultimate test: can SnakeBot adapt to unpredictable moves? Only a
  flexible, layered prompt will help SnakeBot survive the chaos and claim
  victory.*
