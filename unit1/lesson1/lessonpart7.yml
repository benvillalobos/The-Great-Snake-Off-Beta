id: lessonpart7
title: 👑 Serpent Supreme
content: >
  *The stadium shakes as the crowd roars. Giant banners flutter overhead, each
  one painted with a different snake champion. At the center of the arena, the
  floor glows with swirling lights. Suddenly, the ground trembles—a massive,
  coiled red snake slithers into view, muscles rippling, champion belt
  gleaming.*


  **Serpent Supreme**: "Behold! The arena quivers at my presence! I am the
  master of chaos, the sultan of slither, the one and only Serpent Supreme!"


  *SnakeBot bounces nervously beside the player’s side, eyes wide.*


  **SnakeBot**: "Whoa, that’s a lot of muscles. And… is he monologuing already?"


  *Serpent Supreme coils dramatically, raising his head high.*


  **Serpent Supreme**: "Prepare yourselves! For I, Serpent Supreme, shall
  demonstrate the glory of unpredictability! Will I chase food? Will I chase
  you? Or will I simply dance at random? None can know! Not even I!"


  *The crowd gasps as Serpent Supreme bites at SnakeBot, slithers in a zigzag,
  then suddenly lunges for a glowing apple.*


  **SnakeBot**: "Okay, okay, so… what’s the plan? He’s not just going for food,
  and he’s not just chasing me. He’s… doing everything! At once!"


  *Serpent Supreme laughs, his champion belt sparkling.*


  **Serpent Supreme**: "Only the most adaptable shall survive! Can your little
  blue friend keep up with my ever-changing brilliance?"


  *SnakeBot gulps, then grins with determination.*


  **SnakeBot**: "Alright, partner. Looks like it’s time for some next-level
  strategy. If he switches it up, we’ll switch it up too! Let’s show him what
  flexible prompts can do!"
