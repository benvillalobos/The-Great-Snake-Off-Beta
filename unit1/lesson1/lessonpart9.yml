# yaml-language-server: $schema=https://vscodeedu.com/assets/schema/course-v2.schema.json
id: lessonpart9
title: The Winner's Circle
content: >
  *The training area is quieter than the roaring stadium. SnakeBot slithers in,
  sporting a pair of oversized glasses.*&#x20;


  **SnakeBot: **“Welcome, partner! Today’s lesson: What is AI? And what’s this
  LLM thing everyone keeps talking about?”


  *SnakeBot pokes the toolbox with their tail*


  **SnakeBot:** AI, or Artificial Intelligence, is like a toolbox a ton of
  gadgets in it. Each gadget is smart, meaning it can learn and think in the
  same ways humans can. 


  Think of AI like toolbox with a ton of gadgets in it. AI - Artificial
  Intelligence, is the term we use to describe "really smart robots." The thing
  is, they can all do *very *different things. Some create images, some 


  **SnakeBot: **“See this diagram? It’s how I work. You give me a
  **prompt**—that’s your instruction. I send it to my brain, the **LLM** (Large
  Language Model). The LLM is like a robot that’s read a million books, but it
  needs your input to know what to do. When you give me a prompt, I use
  everything I’ve learned to figure out the best move. Then, I turn that into
  **code**—my actions in the game!”


  *SnakeBot leans in, whispering like he's letting you in on something*


  **SnakeBot: **“Here’s the secret: LLMs don’t really understand things like
  humans do. They just predict what comes next, based on patterns they’ve seen.
  It’s like ordering a pizza—you never get the exact same pizza twice. Sometimes
  it’s perfect, sometimes it’s a little weird. That’s why your instructions, or
  **prompts**, matter so much. The better your prompt, the better my moves!”


  *SnakeBot sits up straight, looking proud.*


  **SnakeBot: **“So, partner, your job is to coach me. Give me clear prompts,
  and I’ll do my best to win this tournament. Ready to see what I can do?”
