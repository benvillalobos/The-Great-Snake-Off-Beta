id: lessonpart9
title: The Winner's Circle
content: >+
  ***


  <br />


  Huzzah man you did it!


  > \[!TIP]

  > **WELCOME TO SLITHER SLAM**

  >

  > Slither Slam is a tournament based on the classic game of Snake, but with a
  twist! Instead of one snake chasing after food, two snakes will face head to
  head to see who survives longest!

  >

  > **RULES**

  > * Eat food to grow

  > * Avoid running into walls

  > * Avoid running into yourself

  > * Avoid running into enemy snakes

  > * **Win a round** by being last snake slithering

  > * **Win the match** by winning 3 rounds

